# Local development only: PostgreSQL 17 and Valkey 8, bound to 127.0.0.1.
# Credentials come from .env (generate it with `pnpm env:init`); none are committed.
name: cholo-shikhi-dev
services:
  postgres:
    image: postgres:17-alpine
    # Each integration-test file builds its own schema (35+ migrations) in one transaction; the
    # default lock table (64 per transaction) runs out when many files run in parallel.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: cholo
      POSTGRES_DB: cholo_shikhi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init to create .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cholo -d cholo_shikhi"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${VALKEY_PASSWORD:?Run pnpm env:init to create .env}",
      ]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
volumes:
  pgdata:
